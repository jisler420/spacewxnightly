name: GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage kiosk as site root
        run: |
          mkdir -p _site
          if [ -d kiosk ] && [ -f kiosk/index.html ]; then
            cp -a kiosk/. _site/
          else
            cp -a index.html live.html settings.html spacewx-worker.js favicon.ico favicon.svg _site/ 2>/dev/null || true
          fi
          curl -fsSL --max-time 20 https://kp.gfz.de/fileadmin/files_for_gfz_cms/Hp30_ap30_nowcast.txt -o _site/hp30.txt || true
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
